name: Refresh daily index
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repolore-daily-index
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'coreplanelabs/repolore' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .data/index
          key: repolore-index-${{ github.run_id }}
          restore-keys: repolore-index-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Capture and publish the full daily pool
        run: node scripts/refresh-index.mjs --limit=1000 --publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_INDEX_TOKEN: ${{ secrets.CLOUDFLARE_INDEX_TOKEN }}
